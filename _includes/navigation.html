<style>
/* hidden keeps BFC (preserves nav height) and removes scrollbar */
.nav { overflow: hidden; }

#nav-prompt {
  font-family: monospace;
  font-size: 1.05em;
  display: inline-flex;
  align-items: center;
  position: relative;
  cursor: default;
  user-select: none;
}
#nav-prefix {
  color: #7aa2f7;
}
#nav-prompt-cursor {
  display: inline-block;
  width: 9px;
  height: 1em;
  background: currentColor;
  margin-left: 3px;
  cursor: pointer;
  animation: nav-blink 1s steps(2, start) infinite;
}
@keyframes nav-blink {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0; }
}
#nav-history {
  position: fixed;
  background: #0d0d0d;
  border: 1px solid #333;
  padding: 10px 14px;
  min-width: 220px;
  opacity: 0;
  transform: translateY(-5px);
  pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
  z-index: 1000;
  font-family: monospace;
  color: #eaeaea;
  font-size: 0.88em;
}
#nav-history.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}
.nav-history-title {
  color: #888;
  margin-bottom: 6px;
}
.nav-history-item {
  padding: 3px 0;
  cursor: pointer;
}
.nav-history-item:hover {
  color: #7aa2f7;
}
</style>

<nav class="nav">
  <div class="nav-container">
    <div id="nav-prompt">
      <span id="nav-prefix">&gt;&nbsp;</span><span id="nav-prompt-text"></span><span id="nav-prompt-cursor"></span>
    </div>
    <ul>
      <li><a href="{{ '/posts/' | prepend: site.baseurl }}">Posts</a></li>
      <li><a href="{{ '/tags/' | prepend: site.baseurl }}">Tags</a></li>
      <li><a href="{{ '/about/' | prepend: site.baseurl }}">About</a></li>
    </ul>
  </div>
</nav>

<!-- dropdown lives on body so it is never clipped by .nav overflow -->
<div id="nav-history">
  <div class="nav-history-title">history</div>
  <div id="nav-history-list"></div>
</div>

<script>
(function () {
  function getPromptPath() {
    var p = window.location.pathname.replace(/\/$/, "");
    return p === "" ? "~/blog" : "~/blog" + p;
  }

  /* typing animation */
  var fullText = getPromptPath();
  var textEl   = document.getElementById("nav-prompt-text");
  var i = 0;
  function type() {
    if (i < fullText.length) {
      textEl.textContent += fullText[i++];
      setTimeout(type, 50);
    }
  }
  setTimeout(type, 200);

  /* session history */
  var path = window.location.pathname;
  var hist = JSON.parse(sessionStorage.getItem("navHistory") || "[]");
  if (!hist.includes(path)) hist.push(path);
  sessionStorage.setItem("navHistory", JSON.stringify(hist));

  /* render dropdown */
  var histList = document.getElementById("nav-history-list");
  hist.slice().reverse().forEach(function (p) {
    var item = document.createElement("div");
    item.className = "nav-history-item";
    item.textContent = (p === "/" || p === "") ? "~/blog" : "~/blog" + p.replace(/\/$/, "");
    item.onclick = function () { window.location.href = p; };
    histList.appendChild(item);
  });

  /* position dropdown below the cursor element */
  var cursor   = document.getElementById("nav-prompt-cursor");
  var dropdown = document.getElementById("nav-history");

  function positionDropdown() {
    var rect    = cursor.getBoundingClientRect();
    var dropTop = rect.bottom + 6;
    dropdown.style.top  = dropTop + "px";
    dropdown.style.left = rect.left + "px";

    /* cap height just above the TOC "Contents" header if present */
    var tocEl = document.getElementById("toc");
    if (tocEl) {
      var tocTop = tocEl.getBoundingClientRect().top;
      dropdown.style.maxHeight  = Math.max(40, tocTop - dropTop - 10) + "px";
      dropdown.style.overflowY  = "auto";
    }
  }

  cursor.addEventListener("click", function (e) {
    e.stopPropagation();
    positionDropdown();
    dropdown.classList.toggle("visible");
  });

  document.addEventListener("click", function () {
    dropdown.classList.remove("visible");
  });
}());
</script>
